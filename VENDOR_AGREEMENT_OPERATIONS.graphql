# PROPOSED operations: exact frontend documents, backend implementation required.

query VendorAgreement { vendorAgreement { id revision status version title companyName organisationNumber signerEmail sentAt signedAt approvedAt rejectionReason documentSha256 canSign canGoLive bodySections { heading paragraphs } signer { fullName role email } checks { companyFound companyNameMatches emailVerified documentIntegrityValid checkedAt
    checkedOrganisationNumber
    registryCompanyName
    verificationSource
    verificationMessage } events { id label createdAt } } }

query AdminVendorAgreements($search: String, $status: VendorAgreementStatus, $page: Int!) { adminVendorAgreements(search: $search, status: $status, page: $page, pageSize: 20) { totalCount pageCount counts { pendingSignature pendingApproval active rejected } items { id revision status version title companyName organisationNumber signerEmail sentAt signedAt approvedAt rejectionReason documentSha256 canSign canGoLive bodySections { heading paragraphs } signer { fullName role email } checks { companyFound companyNameMatches emailVerified documentIntegrityValid checkedAt
    checkedOrganisationNumber
    registryCompanyName
    verificationSource
    verificationMessage } events { id label createdAt } } } }

