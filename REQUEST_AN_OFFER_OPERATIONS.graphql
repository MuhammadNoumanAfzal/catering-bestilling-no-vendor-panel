  query OfferCheckoutPreview($input: CheckoutPreviewInput!) {
    offerCheckoutPreview(input: $input) {
      offerBinding { requestId quoteRevision foodTotal }
      currency
      availability {
        isValid
        errors {
          code
          message
          field
          meta
        }
        warnings {
          code
          message
          field
          meta
        }
      }
      pricing { currency foodTotal grossTotal netTotal taxTotal deliveryFee minimumOrderShortfall catalogueDiscount tipAmount }
      items {
        productId
        productName
        pricingType
        unitPrice
        quantity
        personCount
        serves
        lineSubtotal
        lineTax
        lineTotal
        selectedOptions
        selectedAddons {
          name
          unitPrice
          quantity
          totalPrice
        }
      }
      promisedDeliveryWindow {
        minMinutes
        maxMinutes
        label
      }
    }
  }

query OfferPaymentGuard($orderId: ID!) { offerPaymentGuard(orderId:$orderId) { allowed code message offerRequestId quoteRevision } }
query OrderOfferSummaries($orderIds:[ID!]!) { orderOfferSummaries(orderIds:$orderIds) { orderId requestId quoteRevision pricePerPerson personCount amountPaid currency } }

query PayableOffer($id:ID!) { myOfferRequest(id:$id) { id status quote { revision expiresAt } } }
